# Monad: `network = "monad"` needs Foundry >= 1.8
#   https://docs.monad.xyz/tooling-and-infra/toolkits/foundry.md
# Verification: https://docs.monad.xyz/guides/verify-smart-contract/foundry.md also lists
#   `metadata = true` and `metadata_hash = "none"`; Foundry 1.8.3 rejects both as unknown keys, so the
#   default metadata hash is kept (Sourcify uses it for a full match).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 10_000
network = "monad"
use_literal_content = true
fs_permissions = [{ access = "write", path = "../deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
# Public QuickNode endpoint, 50 rps: https://docs.monad.xyz/developer-essentials/testnet.md
monad_testnet = "${MONAD_RPC_URL}"

[lint]
lint_on_build = false
