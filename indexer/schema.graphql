# Event tables carry exactly the fields of the app's History rows (web/lib/server/index/types.ts):
# block, timestamp, tx, logIndex, plus the event's own fields. Aggregates (Creator, Licence, Receipt,
# Brand) are for dashboards and anyone querying the index directly.

type CreatorRegistered {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  creator: String! @index
  payout: String!
  referenceSetHash: String!
}

type TermsSet {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  creator: String! @index
}

type AttestationUpdated {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  creator: String! @index
  referenceSetHash: String!
  verifiedAt: Int!
}

type AllRevoked {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  creator: String! @index
  epoch: Int!
}

type Suspended {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  creator: String! @index
  suspended: Boolean!
  epoch: Int!
}

type LicenceIssued {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  licenceId: BigInt! @index
  creator: String! @index
  licensee: String! @index
  category: Int!
  regions: Int!
  end: Int!
  renderCap: Int!
  pricePerRender: BigInt!
  purposeHash: String!
  autoApproved: Boolean!
}

type LicenceRevoked {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  licenceId: BigInt! @index
  creator: String!
}

type Deposited {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  licenceId: BigInt! @index
  licensee: String!
  amount: BigInt!
}

type RenderPaid {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  licenceId: BigInt! @index
  renderIndex: Int!
  assetHash: String! @index
  agent: String!
  payout: String!
  creatorAmount: BigInt!
  fee: BigInt!
}

type Refunded {
  id: ID!
  block: Int! @index
  timestamp: Int!
  tx: String!
  logIndex: Int!
  licenceId: BigInt! @index
  licensee: String!
  amount: BigInt!
}

# ---------------------------------------------------------------- aggregates

type Creator {
  id: ID! # lower-case address
  payout: String!
  referenceSetHash: String!
  registeredAt: Int!
  attestationUpdatedAt: Int # last re-verification (an upgrade), if any
  categories: Int!
  regions: Int!
  maxDuration: BigInt!
  maxRenders: Int!
  pricePerRender: BigInt!
  autoApprove: Boolean!
  active: Boolean!
  suspended: Boolean!
  epoch: Int!
  licenceCount: Int!
  renderCount: Int!
  earned: BigInt! # USDC paid to the payout address, after the platform fee
  licences: [Licence!]! @derivedFrom(field: "creator")
}

type Licence {
  id: ID! # licence id
  creator: Creator!
  licensee: String! @index
  category: Int!
  regions: Int!
  issuedAt: Int!
  end: Int!
  renderCap: Int!
  renderCount: Int!
  pricePerRender: BigInt!
  purposeHash: String!
  autoApproved: Boolean!
  creatorEpoch: Int!
  revokedAt: Int # by its own revoke; revoke-all and suspension show on the creator's epoch
  deposited: BigInt!
  paidToCreator: BigInt!
  fees: BigInt!
  refunded: BigInt!
  receipts: [Receipt!]! @derivedFrom(field: "licence")
}

type Receipt {
  id: ID! # asset hash (sha256 of the delivered file)
  licence: Licence!
  renderIndex: Int!
  creator: String!
  licensee: String!
  timestamp: Int!
  tx: String!
}

type Brand {
  id: ID! # lower-case address
  licenceCount: Int!
  deposited: BigInt!
  spent: BigInt!
  refunded: BigInt!
}
