# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Likeness on Monad testnet: all four protocol contracts from the deployment block.
#
# Data source: HyperSync (built in for monad-testnet) when ENVIO_API_TOKEN is set, with the RPC as a
# fallback; without a token, the RPC is the sync source (ENVIO_RPC_FOR=sync, the default here).
# `pnpm local` picks this for you. The public RPC serves eth_getLogs 100 blocks at a time.
name: likeness-indexer
contracts:
  - name: CreatorRegistry
    abi_file_path: ./abis/CreatorRegistry.json
    events:
      - event: CreatorRegistered
      - event: AttestationUpdated
      - event: TermsSet
      - event: PayoutSet
      - event: ActiveSet
      - event: AllRevoked
      - event: Suspended
  - name: LicenseRegistry
    abi_file_path: ./abis/LicenseRegistry.json
    events:
      - event: LicenceIssued
      - event: LicenceRevoked
      - event: RenderRecorded
  - name: LicenseEscrow
    abi_file_path: ./abis/LicenseEscrow.json
    events:
      - event: Deposited
      - event: RenderPaid
      - event: Refunded
      - event: RenderAgentSet
  - name: ReceiptAnchor
    abi_file_path: ./abis/ReceiptAnchor.json
    events:
      - event: ReceiptAnchored
field_selection:
  transaction_fields: [hash]
chains:
  - id: 10143
    start_block: ${ENVIO_START_BLOCK:-68463943}
    rpc:
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: ${ENVIO_RPC_FOR:-sync}
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: CreatorRegistry
        address: "0x680A55c0Db4B44def9d88cCBF450C1f5dd37fd9a"
      - name: LicenseRegistry
        address: "0x87934d5E1A61be3Bb06FE54AC7e21E7704731d1C"
      - name: LicenseEscrow
        address: "0x38703a57c5f8eB2F8d1576A3d2B4B35A10D66FA6"
      - name: ReceiptAnchor
        address: "0xE33Dc788C060cb77F79A2AFF96Ca685f6C018721"
